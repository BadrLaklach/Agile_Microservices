server:
  port: 8080

app:
  jwt:
    secret: change-this-secret-to-32-chars-minimum

spring:
  application:
    name: api-gateway
  web:
    problem-details:
      enabled: true
  cloud:
    gateway:
      routes:
        - id: user-service-users
          uri: http://user-service:8081
          predicates:
            - Path=/api/v1/users/**
        - id: user-service-auth
          uri: http://user-service:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: project-management-service
          uri: http://pm-service:8082
          predicates:
            - Path=/api/v1/projects/**
        - id: task-service
          uri: http://task-service:8083
          predicates:
            - Path=/api/v1/tasks/**
        - id: user-service-docs
          uri: http://user-service:8081
          predicates:
            - Path=/v3/api-docs/user-service
          filters:
            - RewritePath=/v3/api-docs/user-service, /v3/api-docs
        - id: pm-service-docs
          uri: http://pm-service:8082
          predicates:
            - Path=/v3/api-docs/pm-service
          filters:
            - RewritePath=/v3/api-docs/pm-service, /v3/api-docs
        - id: task-service-docs
          uri: http://task-service:8083
          predicates:
            - Path=/v3/api-docs/task-service
          filters:
            - RewritePath=/v3/api-docs/task-service, /v3/api-docs
  webflux:
    problemdetails:
      enabled: true

springdoc:
  swagger-ui:
    urls:
      - name: User Service
        url: /v3/api-docs/user-service
      - name: Project Management Service
        url: /v3/api-docs/pm-service
      - name: Task Service
        url: /v3/api-docs/task-service
