apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: agile-app
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: notification-service:v5  # Change to your container registry path in CI/CD
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVER_PORT
              value: "8084"
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: agile-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: agile-config
                  key: RABBITMQ_PORT
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: agile-secret
                  key: RABBITMQ_USERNAME
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agile-secret
                  key: RABBITMQ_PASSWORD
            - name: MAIL_HOST
              valueFrom:
                configMapKeyRef:
                  name: agile-config
                  key: MAIL_HOST
            - name: MAIL_PORT
              valueFrom:
                configMapKeyRef:
                  name: agile-config
                  key: MAIL_PORT
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: agile-secret
                  key: MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agile-secret
                  key: MAIL_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "1"
              memory: "768Mi"

