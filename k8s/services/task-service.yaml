apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
  namespace: agile-app
  labels:
    app: task-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-service
  template:
    metadata:
      labels:
        app: task-service
    spec:
      containers:
        - name: task-service
          image: task-service:v5  # Change to your container registry path in CI/CD
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: agile-config
                  key: TASK_DB_URL
            - name: DB_USERNAME
              value: "task_service_role"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agile-secret
                  key: TASK_DB_PASSWORD
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: agile-config
                  key: TASK_MONGO_URI
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: agile-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: agile-config
                  key: RABBITMQ_PORT
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: agile-secret
                  key: RABBITMQ_USERNAME
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agile-secret
                  key: RABBITMQ_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
          livenessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: task-service
  namespace: agile-app
  labels:
    app: task-service
spec:
  type: ClusterIP
  ports:
    - port: 8083
      targetPort: 8083
      protocol: TCP
      name: http
  selector:
    app: task-service
